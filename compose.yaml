services:
  csin:
    build: .
    restart: unless-stopped
    expose:
      - "4173"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - csin
    environment:
      CSIN_DOMAIN: ${CSIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSIN · Scout</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/scout.css"></head>
<body>
<dialog id="access-dialog" class="access-dialog"><form id="access-form" method="dialog"><span class="wordmark">CSIN</span><h1>Scout access</h1><label>Name<input name="name" autocomplete="name" required maxlength="80"></label><label>Company<input name="company" autocomplete="organization" required maxlength="100"></label><button class="lime" type="submit">Continue</button></form></dialog>
<header class="topbar"><a class="brand" href="/scout"><span class="brand-mark">C</span><strong>CSIN</strong></a><nav><a href="/scout" aria-current="page">Scout</a><a href="/track">Prospect List</a></nav><button id="identity" class="identity" type="button"></button></header>
<main class="scout-page">
 <aside class="province-rail"><h2>Province</h2><div id="province-list"></div></aside>
 <section class="map-stage"><div class="stage-bar"><strong>Scout Network</strong><button id="refresh" type="button">Refresh</button></div><div class="map-key"><span><i></i> Organization</span><span id="network-state">Ready</span></div><svg id="canada" viewBox="0 0 1000 710" role="img" aria-label="Canada map for scouting sample organizations"><g id="provinces"></g><g id="province-labels"></g><g id="nodes"></g></svg><p id="map-error" role="status"></p></section>
 <aside class="criteria-panel"><h2>Funding Criteria</h2><form id="criteria-form"><label>Province<select name="region" id="region"><option>All</option></select></label><label>Sector<select name="focus"><option>All</option><option>Employment</option><option>Housing</option><option>Food access</option><option>Youth</option><option>Family support</option><option>Settlement</option><option>Accessibility</option></select></label><div class="range"><label>Minimum CAD<input name="min" type="number" min="0" value="0" required></label><label>Maximum CAD<input name="max" type="number" min="0" value="150000" required></label></div><label>Funding type<select name="program"><option>All</option><option>Mentoring</option><option>Training</option><option>Workshops</option><option>Housing support</option><option>Food delivery</option><option>Case support</option></select></label><label>Evidence readiness<select name="evidence"><option>All</option><option>Reported outcomes</option><option>Activity only</option></select></label><p id="form-error" role="alert"></p><button class="lime" id="run" type="submit">Scout</button></form></aside>
 <section class="matches" id="matches" hidden><div class="matches-head"><strong id="match-count"></strong><span id="query-summary"></span></div><div id="results"></div></section>
</main>
<script type="module" src="/scout.js"></script></body></html>
